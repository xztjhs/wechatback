[project]
name = "wechatback"
version = "0.1.0"
description = "Export WeChat 4.x chat history into an Obsidian-friendly local vault"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pycryptodome>=3.20",
  "pillow>=10.0",
  "zstandard>=0.22",
]

[project.scripts]
wechatback = "wechatback.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wechatback"]
